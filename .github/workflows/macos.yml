name: macOS native build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install quality tools
        run: python3 -m pip install --break-system-packages clang-format==19.1.7 cpplint==2.0.2
      - name: Formatting and lint
        run: python3 scripts/quality.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bundle Qt and capture build details
        run: |
          macdeployqt build/Neon.app -qmldir=qml
          codesign --force --deep --sign - build/Neon.app
          uname -m > build/platform.txt
          clang++ --version >> build/platform.txt
          ditto -c -k --sequesterRsrc --keepParent build/Neon.app build/Neon-macOS-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-macOS-preview
          path: |
            build/Neon-macOS-preview.zip
            build/platform.txt
            build/smoke.png
